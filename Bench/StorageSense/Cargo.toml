[package]
name    = "scanner"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "scanner"
path = "src/main.rs"

[dependencies]
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
rusqlite     = { version = "0.31", features = ["bundled"] }
walkdir      = "2"
nix          = { version = "0.29", features = ["fs"] }
ahash        = "0.8"
anyhow       = "1"

[profile.release]
opt-level = 3
lto       = true
codegen-units = 1
strip     = true
