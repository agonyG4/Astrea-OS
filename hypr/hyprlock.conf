# ─── Geral ───────────────────────────────────────────────────────
general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
    no_fade_in = false
    no_fade_out = false
}

# ─── Fundo (screenshot com blur) ─────────────────────────────────
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    brightness = 0.6
    contrast = 0.9
    vibrancy = 0.2
}

# ─── Relógio ─────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] echo "<b>$(date +"%H:%M")</b>"
    color = rgba(255, 255, 255, 0.95)
    font_size = 80
    font_family = JetBrainsMono Nerd Font Light
    position = 0, 80
    halign = center
    valign = center
}

# ─── Data ─────────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d de %B")"
    color = rgba(255, 255, 255, 0.55)
    font_size = 16
    font_family = JetBrainsMono Nerd Font Light
    position = 0, -10
    halign = center
    valign = center
}

# ─── Input de senha ───────────────────────────────────────────────
input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.3
    dots_spacing = 0.2
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(255, 255, 255, 0x1a)
    inner_color = rgba(20, 20, 28, 0x88)
    font_color = rgba(255, 255, 255, 0.9)
    fade_on_empty = true
    fade_timeout = 1000
    placeholder_text = <span foreground="##ffffff88">senha...</span>
    hide_input = false
    rounding = 12
    check_color = rgba(100, 200, 150, 0.9)
    fail_color = rgba(255, 100, 100, 0.9)
    fail_text = <i>senha errada</i>
    fail_transition = 300
    capslock_color = rgba(255, 200, 100, 0.9)
    position = 0, -120
    halign = center
    valign = center
}
