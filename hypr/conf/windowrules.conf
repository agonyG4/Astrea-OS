# ##############################
# ### WINDOWS AND WORKSPACES ###
# ##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/
# See https://wiki.hypr.land/Configuring/Workspace-Rules/

# ── Layer Rules ───────────────────────────────────────────────────
layerrule = blur on,           match:namespace bar
layerrule = ignore_alpha 0.5,  match:namespace bar
layerrule = blur on,           match:namespace rofi
layerrule = ignore_alpha 0.5,  match:namespace rofi

# ── Window Rules ──────────────────────────────────────────────────

windowrule {
    # Ignore maximize requests from all apps
    name          = suppress-maximize-events
    match:class   = .*
    suppress_event = maximize
}

windowrule {
    # Fix XWayland drag issues
    name             = fix-xwayland-drags
    match:class      = ^$
    match:title      = ^$
    match:xwayland   = true
    match:float      = true
    match:fullscreen = false
    match:pin        = false
    no_focus         = true
}

windowrule {
    name        = hyprland-run-position
    match:class = hyprland-run
    move        = 20 monitor_h-120
    float       = yes
}

windowrule {
    name        = loupe-float
    match:class = org.gnome.Loupe
    float       = yes
    center      = yes
}

windowrule {
    name        = ark-float
    match:class = org.kde.ark
    float       = yes
    center      = yes
}

# ── Spotify ───────────────────────────────────────────────────────
windowrule {
    name        = spotify-workspace
    match:class = Spotify
    workspace   = 10 silent
}

# ── Steam ─────────────────────────────────────────────────────────
windowrule {
    name        = steam-float
    match:class = steam
    match:title = (?!Big Picture).*
    float       = yes
}