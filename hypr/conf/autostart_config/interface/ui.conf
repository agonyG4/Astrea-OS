# ##################
# ### UI COMPONENTS ###
# ##################

# Status bar (Waybar)
exec-once = pkill -x playerctl || true
exec = quickshell -p ~/.config/quickshell

# GTK Themes and Dark Mode
exec = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark" # para aplicativos GTK4 
exec = gsettings set org.gnome.desktop.interface gtk-theme "adw-gtk3-dark" # para aplicativos GTK3 
