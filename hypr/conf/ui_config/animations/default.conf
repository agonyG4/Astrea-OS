animations {
    enabled = yes

    # Beziers
    bezier = easeOutExpo,    0.16, 1,    0.3,  1
    bezier = easeOutBack,    0.34, 1.56, 0.64, 1
    bezier = easeInOutExpo,  0.87, 0,    0.13, 1
    bezier = linear,         0,    0,    1,    1
    bezier = quick,          0.15, 0,    0.1,  1
    bezier = bounce,         0.34, 1.8,  0.64, 1

    # Windows — abre com um popin gostoso, fecha rápido (ninguém quer esperar janela fechar)
    animation = windowsIn,     1,  4.5,  easeOutBack,  popin 80%
    animation = windowsOut,    1,  1.8,  quick,        popin 80%
    animation = windowsMove,   1,  3.5,  easeOutExpo

    # Fade
    animation = fadeIn,        1,  3.0,  easeOutExpo
    animation = fadeOut,       1,  1.5,  quick
    animation = fadeDim,       1,  3.0,  easeOutExpo
    animation = fadeShadow,    1,  3.0,  easeOutExpo
    animation = fadeSwitch,    1,  2.5,  easeOutExpo

    # Border
    animation = border,        1,  4.0,  easeOutExpo

    # Layers (waybar, rofi, etc)
    animation = layersIn,      1,  3.5,  easeOutBack,  fade
    animation = layersOut,     1,  1.5,  quick,        fade
    animation = fadeLayersIn,  1,  3.5,  easeOutExpo
    animation = fadeLayersOut, 1,  1.2,  quick

    # Workspaces — slide lateral maneiro
    animation = workspaces,    1,  3.5,  easeOutExpo,  slide
    animation = workspacesIn,  1,  3.5,  easeOutExpo,  slide
    animation = workspacesOut, 1,  2.5,  easeOutExpo,  slide
}