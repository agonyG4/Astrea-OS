# #############################
# ### INTEL — GPU ESPECÍFICO ###
# #############################
# Referência: https://wiki.hypr.land/Configuring/Environment-variables/
# Requer: mesa + vulkan-intel (ANV) + intel-media-driver (iHD) ou libva-intel-driver (i965)
# Carregue após env.conf:
#
#   source = ~/.config/hypr/env.conf
#   source = ~/.config/hypr/intel.conf

# ── Driver e renderização ─────────────────────────────────────────
env = LIBVA_DRIVER_NAME, iHD       # VA-API via intel-media-driver (Broadwell/Gen8+)
                                   # Use "i965" para CPUs Haswell ou mais antigas
env = VDPAU_DRIVER,      va_gl     # Intel não tem VDPAU nativo; usa VA-GL como ponte

# ── Mesa / iris ───────────────────────────────────────────────────
env = MESA_LOADER_DRIVER_OVERRIDE, iris   # Driver iris (padrão moderno, Gen8+)
                                          # Use "i915" apenas em hardware muito antigo

# ── Vulkan (ANV) ──────────────────────────────────────────────────
# O driver ANV é detectado automaticamente na maioria dos casos.
# Descomente abaixo SOMENTE em sistemas híbridos onde outro ICD tem prioridade:
# env = VK_ICD_FILENAMES, /usr/share/vulkan/icd.d/intel_icd.x86_64.json

# ── Intel Arc (Xe) — extras ───────────────────────────────────────
# env = NEO_BITS_PER_PIXEL, 32                           # Força 32bpp (corrige artefatos)
# env = INTEL_COMPUTE_RUNTIME_FORCE_MAX_L3_MOCS, 1       # Melhor perf em GPU compute