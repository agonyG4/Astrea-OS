# ###############################################
# ### Hyprland environment variables          ###
# ### source = ~/.config/hypr/conf/amd.conf  ###
# ###############################################
# Requer: mesa, vulkan-radeon, libva-mesa-driver
# Opcional gaming: lib32-mesa, lib32-vulkan-radeon

# ── Driver principal ─────────────────────────────────────────────
env = LIBVA_DRIVER_NAME,            radeonsi   # VA-API acelerado por hardware
env = VDPAU_DRIVER,                 radeonsi   # VDPAU via Mesa
env = MESA_LOADER_DRIVER_OVERRIDE,  radeonsi   # Força radeonsi
env = AMD_VULKAN_ICD,               RADV       # RADV (Mesa) — melhor que AMDVLK no RDNA2

# ── ACO Shader Compiler ──────────────────────────────────────────
# ACO é padrão no RADV mas perftest ativa otimizações extras
env = RADV_PERFTEST,                gpl,nggc   # Graphics Pipeline Library + NGG Culling
# gpl  = compila shaders em paralelo (menos stutters)
# nggc = Next Gen Geometry Culling (descarta geo invisível, +fps RDNA2)

# ── Wayland / Compositor ─────────────────────────────────────────
env = MESA_VK_WSI_PRESENT_MODE,     mailbox    # Menor latência no desktop
env = WLR_NO_HARDWARE_CURSORS,      0          # Cursor em hardware (mais suave)
env = __GL_GSYNC_ALLOWED,           1          # FreeSync via OpenGL

# ── Gaming / DXVK / Proton ───────────────────────────────────────
env = DXVK_ASYNC,                   1          # Async shader compilation (menos stutters)
env = DXVK_STATE_CACHE,             1          # Cache de shaders compilados
env = WINE_FULLSCREEN_FSR,          1          # FSR upscaling no Wine/Proton
env = WINE_FULLSCREEN_FSR_STRENGTH, 2          # 0=ultra quality, 5=performance
env = PROTON_ENABLE_NVAPI,          0          # Desativa NVAPI falso (irrelevante em AMD)
env = PROTON_HIDE_NVIDIA_GPU,       1          # Evita confusão de detecção de GPU

# ── FreeSync / VRR ───────────────────────────────────────────────
# Ative no hyprland.conf também:
#   monitor = DP-1, 1920x1080@165, 0x0, 1, vrr, 1
env = DXVK_ASYNC,                   1

# ── Firefox VA-API (vídeo acelerado) ─────────────────────────────
env = MOZ_DISABLE_RDD_SANDBOX,      1          # Habilita VA-API no Firefox
env = MOZ_DRM_DEVICE,               /dev/dri/renderD128  # GPU primária

# ── ROCm / OpenCL (compute — opcional) ───────────────────────────
# Descomente se usar apps de compute (Blender, IA, etc)
# env = HSA_OVERRIDE_GFX_VERSION,   10.3.0     # RX 6600 = GFX 10.3
# env = ROC_ENABLE_PRE_VEGA,        0          # Não necessário no RDNA2

# ── Overclock / Performance (requer lact instalado) ──────────────
# Configure via: lact (app gráfico) ou
# sudo amdgpu-pro-clinfo para verificar clocks