# #############################
# ### ENVIRONMENT VARIABLES ###
# #############################

# See https://wiki.hypr.land/Configuring/Environment-variables/

# ── Cursor ────────────────────────────────────────────────────────
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# ── NVIDIA (Wayland) ──────────────────────────────────────────────
env = LIBVA_DRIVER_NAME,nvidia
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = __NV_PRIME_RENDER_OFFLOAD,1
env = NVD_BACKEND,direct

# ── Wayland — app compatibility ───────────────────────────────────
env = MOZ_ENABLE_WAYLAND,1                   # Firefox native Wayland
env = ELECTRON_OZONE_PLATFORM_HINT,auto      # Electron apps (VS Code, Discord, etc.)
env = SDL_VIDEODRIVER,wayland                # SDL2 games
env = OZONE_PLATFORM,wayland                 # Chromium-based browsers
env = GDK_BACKEND,wayland,x11

# ── Qt ────────────────────────────────────────────────────────────
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_STYLE_OVERRIDE,kvantum
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1

# ── GTK / XDG ─────────────────────────────────────────────────────
env = XDG_MENU_PREFIX,arch-
env = XDG_SESSION_TYPE,wayland
env = XDG_CURRENT_DESKTOP,Hyprland