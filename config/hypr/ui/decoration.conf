# ######################
# ### VISUAL EFFECTS ###
# ######################

decoration {
    rounding       = 12
    rounding_power = 2

    active_opacity   = 1.0
    inactive_opacity = 0.92

    dim_inactive = true
    dim_strength = 0.08  # subtle depth cue — clearly active vs inactive
    dim_special = 0

    shadow {
        enabled        = false
        range          = 50
        render_power   = 3
        offset         = 0, 8
        color          = rgba(00000055)
        color_inactive = rgba(00000020)
    }

    blur {
        enabled           = true
        size              = 3    # smaller radius → fewer samples
        passes            = 3   # more passes compensate → same quality, better perf
        noise             = 0.012
        contrast          = 1
        brightness        = 1
        vibrancy          = 0.25
        vibrancy_darkness = 0
        new_optimizations = true
        xray              = false
        special           = true
        popups            = true
        popups_ignorealpha = 0.05
    }
}

plugin:dynamic-cursors {
    enabled = false
    mode = none


    shake {
        enabled   = true
        nearest   = false
        threshold = 6.0
        base      = 4.0
        speed     = 4.0
        influence = 0.0
        limit     = 0.0
        timeout   = 2000
        effects   = false
        ipc       = false
    }

    hyprcursor {
        nearest    = false
        enabled    = true
        resoluton = 96
        fallback   = clientside
    }
}