animations {
    enabled = yes

    # ──────────────────────────────────────────────────────────────────
    # Bezier curves
    # ──────────────────────────────────────────────────────────────────
    bezier = easeOutExpo,   0.16, 1,    0.3,  1
    bezier = easeOutCubic,  0.33, 1,    0.68, 1
    bezier = easeInOutExpo, 0.87, 0,    0.13, 1
    bezier = easeOutBack,   0.34, 1.56, 0.64, 1
    bezier = linear,        0,    0,    1,    1
    bezier = quick,         0.15, 0,    0.1,  1

    # ──────────────────────────────────────────────────────────────────
    # Windows — snappy open with pop-in, instant close
    # ──────────────────────────────────────────────────────────────────
    animation = windowsIn,  1, 2.5, easeOutBack, popin 80%
    animation = windowsOut, 1, 2.5, easeOutExpo
    animation = windowsMove, 1, 2.5, easeOutExpo

    # ──────────────────────────────────────────────────────────────────
    # Fade
    # ──────────────────────────────────────────────────────────────────
    animation = fadeIn,      1, 3.0, easeOutExpo
    animation = fadeOut,     1, 1.5, quick
    animation = fadeDim,     1, 3.0, easeOutExpo
    animation = fadeShadow,  1, 3.0, easeOutExpo
    animation = fadeSwitch, 1, 2.5, easeOutExpo
    # ──────────────────────────────────────────────────────────────────
    # Layers (quickshell bar, rofi, popups)
    # ──────────────────────────────────────────────────────────────────
    animation = layersIn,      1, 3.5, easeOutBack,  fade
    animation = layersOut, 1, 1.5, quick
    animation = fadeLayersIn,  1, 3.5, easeOutExpo
    animation = fadeLayersOut, 1, 1.2, quick

    # ──────────────────────────────────────────────────────────────────
    # Workspaces — slide + fade combo for a polished feel
    # ──────────────────────────────────────────────────────────────────
    animation = workspaces,       1, 2.5, easeOutExpo, slide
    animation = workspacesIn,     1, 2.5, easeOutExpo, slide
    animation = workspacesOut,    1, 2.5, easeOutExpo, slide

    # Scratchpad / special workspace — slides vertically
    animation = specialWorkspace, 1, 3.5, easeOutExpo, slide
}