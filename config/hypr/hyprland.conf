# ─────────────────────────────────────────────────────────────────────────────
# Hyprland Configuration — Root Entry Point
# https://wiki.hypr.land/Configuring/
# ─────────────────────────────────────────────────────────────────────────────

# --- Core Hardware & Wayland ---
source = ~/.config/hypr/core/monitors.conf
source = ~/.config/hypr/core/environment.conf
source = ~/.config/hypr/core/input.conf

# --- System & Rules ---
source = ~/.config/hypr/system/autostart.conf
source = ~/.config/hypr/system/programs.conf
source = ~/.config/hypr/system/rules/windowrules.conf

# --- UI & Theming ---
source = ~/.config/hypr/ui/theme.conf

# --- Keybindings ---
source = ~/.config/hypr/bindings/keybindings.conf

# --- Hardware Optimizations (Optional) ---
# source = ~/.config/hypr/core/optimizations/nvidia.conf
# source = ~/.config/hypr/core/optimizations/amd.conf
# source = ~/.config/hypr/core/optimizations/intel.conf