context.modules = [
    { name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "Astrea Spatial Audio"
            media.name       = "Astrea Spatial Audio"

            filter.graph = {
                nodes = [
                    { type = builtin label = copy name = copyFL  }
                    { type = builtin label = copy name = copyFR  }
                    { type = builtin label = copy name = copyFC  }
                    { type = builtin label = copy name = copyLFE }
                    { type = builtin label = copy name = copyRL  }
                    { type = builtin label = copy name = copyRR  }
                    { type = builtin label = copy name = copySL  }
                    { type = builtin label = copy name = copySR  }

                    # 16ch order:
                    # 0/1 FL, 2/3 FR, 4/5 FC, 6/7 LFE, 8/9 RL, 10/11 RR, 12/13 SL, 14/15 SR
                    { type = builtin label = convolver name = convFL_L  config = { filename = "/home/agony/.local/share/Astrea/audio/hrir.wav" channel = 0  } }
                    { type = builtin label = convolver name = convFL_R  config = { filename = "/home/agony/.local/share/Astrea/audio/hrir.wav" channel = 1  } }
                    { type = builtin label = convolver name = convFR_L  config = { filename = "/home/agony/.local/share/Astrea/audio/hrir.wav" channel = 2  } }
                    { type = builtin label = convolver name = convFR_R  config = { filename = "/home/agony/.local/share/Astrea/audio/hrir.wav" channel = 3  } }
                    { type = builtin label = convolver name = convFC_L  config = { filename = "/home/agony/.local/share/Astrea/audio/hrir.wav" channel = 4  } }
                    { type = builtin label = convolver name = convFC_R  config = { filename = "/home/agony/.local/share/Astrea/audio/hrir.wav" channel = 5  } }
                    { type = builtin label = convolver name = convLFE_L config = { filename = "/home/agony/.local/share/Astrea/audio/hrir.wav" channel = 6  } }
                    { type = builtin label = convolver name = convLFE_R config = { filename = "/home/agony/.local/share/Astrea/audio/hrir.wav" channel = 7  } }
                    { type = builtin label = convolver name = convRL_L  config = { filename = "/home/agony/.local/share/Astrea/audio/hrir.wav" channel = 8  } }
                    { type = builtin label = convolver name = convRL_R  config = { filename = "/home/agony/.local/share/Astrea/audio/hrir.wav" channel = 9  } }
                    { type = builtin label = convolver name = convRR_L  config = { filename = "/home/agony/.local/share/Astrea/audio/hrir.wav" channel = 10 } }
                    { type = builtin label = convolver name = convRR_R  config = { filename = "/home/agony/.local/share/Astrea/audio/hrir.wav" channel = 11 } }
                    { type = builtin label = convolver name = convSL_L  config = { filename = "/home/agony/.local/share/Astrea/audio/hrir.wav" channel = 12 } }
                    { type = builtin label = convolver name = convSL_R  config = { filename = "/home/agony/.local/share/Astrea/audio/hrir.wav" channel = 13 } }
                    { type = builtin label = convolver name = convSR_L  config = { filename = "/home/agony/.local/share/Astrea/audio/hrir.wav" channel = 14 } }
                    { type = builtin label = convolver name = convSR_R  config = { filename = "/home/agony/.local/share/Astrea/audio/hrir.wav" channel = 15 } }

                    { type = builtin label = mixer name = mixL control = {
                        "Gain 1" = 1.75
                        "Gain 2" = 1.75
                        "Gain 3" = 1.75
                        "Gain 4" = 0.75
                        "Gain 5" = 1.75
                        "Gain 6" = 1.75
                        "Gain 7" = 1.75
                        "Gain 8" = 1.75
                    } }

                    { type = builtin label = mixer name = mixR control = {
                        "Gain 1" = 1.75
                        "Gain 2" = 1.75
                        "Gain 3" = 1.75
                        "Gain 4" = 0.75
                        "Gain 5" = 1.75
                        "Gain 6" = 1.75
                        "Gain 7" = 1.75
                        "Gain 8" = 1.75
                    } }

                    { type = builtin label = copy name = outL }
                    { type = builtin label = copy name = outR }
                ]

                links = [
                    { output = "copyFL:Out"  input = "convFL_L:In"  }
                    { output = "copyFL:Out"  input = "convFL_R:In"  }
                    { output = "copyFR:Out"  input = "convFR_L:In"  }
                    { output = "copyFR:Out"  input = "convFR_R:In"  }
                    { output = "copyFC:Out"  input = "convFC_L:In"  }
                    { output = "copyFC:Out"  input = "convFC_R:In"  }
                    { output = "copyLFE:Out" input = "convLFE_L:In" }
                    { output = "copyLFE:Out" input = "convLFE_R:In" }
                    { output = "copyRL:Out"  input = "convRL_L:In"  }
                    { output = "copyRL:Out"  input = "convRL_R:In"  }
                    { output = "copyRR:Out"  input = "convRR_L:In"  }
                    { output = "copyRR:Out"  input = "convRR_R:In"  }
                    { output = "copySL:Out"  input = "convSL_L:In"  }
                    { output = "copySL:Out"  input = "convSL_R:In"  }
                    { output = "copySR:Out"  input = "convSR_L:In"  }
                    { output = "copySR:Out"  input = "convSR_R:In"  }

                    { output = "convFL_L:Out"  input = "mixL:In 1" }
                    { output = "convFL_R:Out"  input = "mixR:In 1" }
                    { output = "convFR_L:Out"  input = "mixL:In 2" }
                    { output = "convFR_R:Out"  input = "mixR:In 2" }
                    { output = "convFC_L:Out"  input = "mixL:In 3" }
                    { output = "convFC_R:Out"  input = "mixR:In 3" }
                    { output = "convLFE_L:Out" input = "mixL:In 4" }
                    { output = "convLFE_R:Out" input = "mixR:In 4" }
                    { output = "convRL_L:Out"  input = "mixL:In 5" }
                    { output = "convRL_R:Out"  input = "mixR:In 5" }
                    { output = "convRR_L:Out"  input = "mixL:In 6" }
                    { output = "convRR_R:Out"  input = "mixR:In 6" }
                    { output = "convSL_L:Out"  input = "mixL:In 7" }
                    { output = "convSL_R:Out"  input = "mixR:In 7" }
                    { output = "convSR_L:Out"  input = "mixL:In 8" }
                    { output = "convSR_R:Out"  input = "mixR:In 8" }

                    { output = "mixL:Out" input = "outL:In" }
                    { output = "mixR:Out" input = "outR:In" }
                ]

                inputs = [
                    "copyFL:In"
                    "copyFR:In"
                    "copyFC:In"
                    "copyLFE:In"
                    "copyRL:In"
                    "copyRR:In"
                    "copySL:In"
                    "copySR:In"
                ]

                outputs = [ "outL:Out" "outR:Out" ]
            }

            capture.props = {
                node.name      = "effect_input.virtual-surround-7.1-astrea"
                media.class    = "Audio/Sink"
                audio.channels = 8
                audio.position = [ FL FR FC LFE RL RR SL SR ]
            }

            playback.props = {
                node.name      = "effect_output.virtual-surround-7.1-astrea"
                node.passive   = true
                target.object  = "alsa_output.usb-Corsair_Corsair_HS60_PRO_Surround_USB_Sound_Adapter_00000000-00.analog-stereo"
                audio.channels = 2
                audio.position = [ FL FR ]
            }
        }
    }
]
