# ###########################
# ### AMD — GPU ESPECÍFICO ###
# ###########################
# Referência: https://wiki.hypr.land/Configuring/Environment-variables/
# Requer: mesa + vulkan-radeon (RADV) + libva-mesa-driver
# Carregue após env.conf:
#
#   source = ~/.config/hypr/env.conf
#   source = ~/.config/hypr/amd.conf

# ── Driver e renderização ─────────────────────────────────────────
env = LIBVA_DRIVER_NAME,           radeonsi  # VA-API via Mesa (decodificação de vídeo)
env = VDPAU_DRIVER,                radeonsi  # VDPAU via Mesa
env = MESA_LOADER_DRIVER_OVERRIDE, radeonsi  # Força driver radeonsi (útil em híbridos)

# ── Vulkan (RADV) ─────────────────────────────────────────────────
env = AMD_VULKAN_ICD, RADV         # Usa RADV (Mesa) em vez do AMDVLK proprietário
                                   # Troque para AMDVLK se preferir o driver oficial AMD

# ── Shader compiler (ACO) ─────────────────────────────────────────
env = RADV_PERFTEST, aco           # Otimizações experimentais do ACO shader compiler

# ── FreeSync / VRR ────────────────────────────────────────────────
env = DXVK_ASYNC, 1               # Async shader compilation (Wine / Proton / DXVK)

# ── ROCm / OpenCL (GPU compute — opcional) ────────────────────────
# env = ROC_ENABLE_PRE_VEGA, 1              # Habilita ROCm em GPUs pré-Vega (experimental)
# env = HSA_OVERRIDE_GFX_VERSION, 10.3.0   # Força versão GFX para apps ROCm específicos