# ##############################
# ### NVIDIA — GPU ESPECÍFICO ###
# ##############################
# Referência: https://wiki.hypr.land/Configuring/Environment-variables/
# Requer: driver proprietário NVIDIA + nvidia-utils + libva-nvidia-driver
# Carregue após env.conf:
#
#   source = ~/.config/hypr/env.conf
#   source = ~/.config/hypr/nvidia.conf

# ── Driver e renderização ─────────────────────────────────────────
env = LIBVA_DRIVER_NAME,         nvidia      # VA-API via NVDEC/NVENC
env = GBM_BACKEND,               nvidia-drm  # GBM backend para Wayland
env = __GLX_VENDOR_LIBRARY_NAME, nvidia      # Garante uso da libGL da NVIDIA
env = NVD_BACKEND,               direct      # Backend direto (melhor perf que ffmpeg)

# ── PRIME / híbrido (iGPU + dGPU) ────────────────────────────────
env = __NV_PRIME_RENDER_OFFLOAD, 1           # Ativa PRIME offload
env = __VK_LAYER_NV_optimus,     NVIDIA_only # Força Vulkan na NVIDIA em sistemas híbridos

# ── Sync / VRR ────────────────────────────────────────────────────
env = __GL_GSYNC_ALLOWED, 1                  # Habilita G-Sync / Adaptive Sync
env = __GL_VRR_ALLOWED,   1                  # VRR (Variable Refresh Rate)

# ── Vulkan / VDPAU ────────────────────────────────────────────────
env = VK_DRIVER_FILES, /usr/share/vulkan/icd.d/nvidia_icd.json  # ICD Vulkan explícito
env = VDPAU_DRIVER,    nvidia                                     # VDPAU via NVIDIA

# ── Workarounds ───────────────────────────────────────────────────
env = WLR_NO_HARDWARE_CURSORS, 1             # Evita artefatos de cursor na NVIDIA