# ###############################################
# ### Hyprland environment variables           ###
# ### source = ~/.config/hypr/conf/nvidia.conf ###
# ###############################################
# Requer: nvidia-open-dkms (ou nvidia-dkms), nvidia-utils
#         libva-nvidia-driver, egl-wayland
# Opcional: lib32-nvidia-utils (Steam/Wine)

# ── Driver principal ─────────────────────────────────────────────
env = LIBVA_DRIVER_NAME,          nvidia      # VA-API via NVDEC
env = GBM_BACKEND,                nvidia-drm  # GBM backend Wayland
env = __GLX_VENDOR_LIBRARY_NAME,  nvidia      # Garante libGL da NVIDIA
env = NVD_BACKEND,                direct      # Backend direto (melhor que ffmpeg)
env = VDPAU_DRIVER,               nvidia      # VDPAU via NVIDIA

# ── Wayland / EGL ────────────────────────────────────────────────
env = WLR_NO_HARDWARE_CURSORS,    1           # Evita artefatos de cursor
env = ELECTRON_OZONE_PLATFORM_HINT, wayland   # Electron apps nativos no Wayland
env = GDK_BACKEND,                wayland,x11 # GTK prefere Wayland
env = QT_QPA_PLATFORM,            wayland     # Qt nativo no Wayland
env = SDL_VIDEODRIVER,            wayland     # SDL (jogos) usa Wayland

# ── Vulkan ───────────────────────────────────────────────────────
env = VK_DRIVER_FILES, /usr/share/vulkan/icd.d/nvidia_icd.json

# ── Sync / VRR / G-Sync ──────────────────────────────────────────
env = __GL_GSYNC_ALLOWED,         1           # G-Sync / Adaptive Sync
env = __GL_VRR_ALLOWED,           1           # VRR (Variable Refresh Rate)

# ── Gaming / DXVK / Proton ───────────────────────────────────────
env = DXVK_ASYNC,                 1           # Async shader compilation
env = DXVK_STATE_CACHE,           1           # Cache de shaders compilados
env = PROTON_ENABLE_NVAPI,        1           # NVAPI ativo (DLSS, Reflex, etc)
env = PROTON_HIDE_NVIDIA_GPU,     0           # Mantém detecção da GPU
env = __GL_SHADER_DISK_CACHE,     1           # Cache de shaders OpenGL
env = __GL_SHADER_DISK_CACHE_SKIP_CLEANUP, 1  # Não limpa cache automaticamente

# ── DLSS / NVENC / NVDEC ─────────────────────────────────────────
# DLSS funciona automaticamente via PROTON_ENABLE_NVAPI=1
# NVENC (OBS, encoding de vídeo) não precisa de env vars extras
# Para forçar NVENC no OBS: usar plugin obs-nvenc-plugin

# ── Firefox VA-API (vídeo acelerado) ─────────────────────────────
env = MOZ_DISABLE_RDD_SANDBOX,    1           # Habilita VA-API no Firefox
env = MOZ_DRM_DEVICE,             /dev/dri/renderD128

# ── PRIME / Híbrido (só se tiver iGPU + dGPU) ───────────────────
# Descomente se o sistema tiver Intel/AMD integrado + NVIDIA dedicada
# env = __NV_PRIME_RENDER_OFFLOAD,          1
# env = __NV_PRIME_RENDER_OFFLOAD_PROVIDER, NVIDIA-G0
# env = __VK_LAYER_NV_optimus,              NVIDIA_only

# ── Kernel params recomendados (/etc/modprobe.d/nvidia.conf) ─────
# options nvidia_drm modeset=1 fbdev=1
# options nvidia NVreg_UsePageAttributeTable=1
# options nvidia NVreg_EnableGpuFirmware=0   # Desativa GSP firmware (mais estável)