# #############################
# ### ENVIRONMENT VARIABLES ###
# #############################
# Referência: https://wiki.hypr.land/Configuring/Environment-variables/
# Arquivo base — carregue este SEMPRE, independente da GPU.
# Em seguida, carregue o arquivo específico da sua GPU:
#
#   source = ~/.config/hypr/env.conf
source = ~/.config/hypr/conf/optimizations/nvidia.conf   # ou amd.conf / intel.conf

# ── Cursor ────────────────────────────────────────────────────────
env = XCURSOR_THEME,    MacOS
env = XCURSOR_SIZE,     24
env = HYPRCURSOR_THEME, MacOS
env = HYPRCURSOR_SIZE,  24

# ── Wayland — compatibilidade de apps ─────────────────────────────
env = MOZ_ENABLE_WAYLAND,           1        # Firefox nativo no Wayland
env = ELECTRON_OZONE_PLATFORM_HINT, auto     # VS Code, Discord, Obsidian, etc.
env = SDL_VIDEODRIVER,              wayland  # Jogos SDL2
env = SDL_RENDER_DRIVER,            vulkan   # Renderer Vulkan para SDL2
env = OZONE_PLATFORM,               wayland  # Navegadores Chromium
env = GDK_BACKEND,                  wayland  # Força backend Wayland no GTK
env = CLUTTER_BACKEND,              wayland  # Apps GTK que usam Clutter (GNOME legacy)

# ── Qt ────────────────────────────────────────────────────────────
env = QT_QPA_PLATFORM,                     wayland;xcb  # Prefere Wayland, fallback XCB
env = QT_QPA_PLATFORMTHEME,                qt6ct        # Tema via qt6ct
env = QT_STYLE_OVERRIDE,                   kvantum      # Estilo via Kvantum
env = QT_WAYLAND_DISABLE_WINDOWDECORATION, 1            # Decorações pelo WM

# ── GTK / XDG ─────────────────────────────────────────────────────
env = XDG_MENU_PREFIX,     arch-      # Prefixo dos menus (.desktop do Arch)
env = XDG_SESSION_TYPE,    wayland    # Informa ao sistema que é sessão Wayland
env = XDG_CURRENT_DESKTOP, Hyprland  # Identificação do desktop atual

# ── Java / AWT ────────────────────────────────────────────────────
env = _JAVA_AWT_WM_NONREPARENTING, 1                              # Corrige janelas Java em WMs (IntelliJ, etc.)
env = JDK_JAVA_OPTIONS, -Dawt.useSystemAAFontSettings=lcd         # Anti-aliasing em fontes Java